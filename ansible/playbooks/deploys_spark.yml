---
- name: Spark Master en el master
  hosts: masters
  become: true

  tasks:
    - name: Contenedor Spark Master
      community.docker.docker_container:
        name: spark-master
        image: apache/spark-py
        state: started
        recreate: false
        restart_policy: unless-stopped
        user: "0"
        network_mode: host
        volumes:
          - /vagrant:/vagrant
        command: bash -c "/opt/spark/sbin/start-master.sh -h {{ ansible_host }} -p 7077 --webui-port 8080 && tail -f /dev/null"

- name: Spark Worker en los workers
  hosts: workers
  become: true

  tasks:
    - name: Contenedor Spark Worker
      community.docker.docker_container:
        name: spark-worker
        image: apache/spark-py
        state: started
        recreate: false
        restart_policy: unless-stopped
        user: "0"
        network_mode: host
        command: bash -c "/opt/spark/sbin/start-worker.sh spark://192.168.56.10:7077 -h {{ ansible_host }} -c 1 -m 1G --webui-port 8081 && tail -f /dev/null"
